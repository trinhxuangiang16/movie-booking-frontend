name: Frontend CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy Frontend to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Truy cập thư mục dự án chung trên VPS
            cd /var/www/movie-booking-app-fullstack
            
            # 2. Pull code mới của repo Frontend (thư mục movie-booking-frontend)
            cd movie-booking-frontend
            git pull origin main
            cd ..
            
            # 3. Build lại và chạy đúng container fe
            docker compose -f docker-compose.prod.yml up -d --build fe
            
            # 4. Dọn dẹp Docker rác
            docker image prune -f
